<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevStudio Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B8FA2E'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='18' fill='%230A0A0A'%3ED%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error
      // by providing a setter that ignores the assignment.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return originalFetch; },
          set: function(val) { 
            console.warn('Ignored attempt to overwrite window.fetch');
          },
          configurable: true
        });
      } catch (e) {
        console.error('Failed to polyfill fetch setter:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
